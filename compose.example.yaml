# Copy to compose.yaml and adjust the host paths.
services:
  1g1r-webui:
    build: .
    image: 1g1r-webui
    # Run as your own user so files in your ROM folders keep your ownership.
    user: "1000:1000"
    ports:
      - "8080:8080"
    volumes:
      # Settings, database, DATs and caches.
      - ./data:/data
      # Main ROM mount. Platform folders are picked from here, and discarded
      # files go to its discarded/ subfolder.
      - /path/to/roms:/roms
      # Optional extra mounts (other disks) go under /mnt/<name>:
      # - /path/to/other-disk/roms:/mnt/other-disk
    restart: unless-stopped
