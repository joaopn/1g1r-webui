[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "g1r"
version = "0.1.0"
description = "Web UI for lossless ROM conversion and 1G1R selection, reviewed before applying"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "fastapi~=0.143.3",
    "uvicorn~=0.54.0",
    "jinja2~=3.1.6",
    "pydantic~=2.14.1",
    "pyyaml~=6.0.3",
    "python-multipart~=0.0.32",
]

[project.optional-dependencies]
dev = ["pytest~=9.1.1", "httpx2~=2.13.1", "ruff~=0.17.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
g1r = ["defaults.yaml", "migrations/*.sql", "web/templates/*.html", "web/static/*.css", "web/static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
# Tests compare against literal expected values on purpose.
"tests/**" = ["PLR2004"]
