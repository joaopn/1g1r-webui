# Every tunable value of the application lives here; code never hardcodes one. What a
# user sets is in the compose file or the web UI, not here.

app:
  name: 1g1r-webui
  # AGPL-3.0 §13: the running web UI links to its source.
  source_url: https://github.com/joaopn/1g1r-webui

server:
  host: 0.0.0.0
  port: 8077

paths:
  # Where the database, DATs, caches and keys live (the compose file's data/ mount).
  data_dir: /data
  database_file: state.db
  # Written by the app: folders, per-platform targets, ignored filenames (human-readable).
  library_file: library.yaml
  # The built web app (index.html + assets/).
  web_dist: /opt/app/web/dist
  # The main ROM bind mount; discarded files go to <roms_root>/<discarded_dirname>/.
  roms_root: /roms
  discarded_dirname: discarded
  # Additional bind mounts are declared in compose under this directory.
  extra_mounts_root: /mnt

database:
  busy_timeout_ms: 5000

ui:
  # Rows shown per page of every table (games on the Matching table), set in Settings ->
  # Advanced, up to max_page_size.
  page_size: 50
  max_page_size: 1000
  # Most DAT entries listed when searching the DAT to assign a file by hand.
  dat_search_limit: 25
  # How often a running scan's status is refreshed in the browser.
  poll_interval_ms: 1000
  # Characters of a hash shown in tables (the full value is in the tooltip).
  hash_display_length: 12
  # Sizes are shown in these units, each this many times the previous.
  byte_unit_base: 1024
  byte_units: [B, KiB, MiB, GiB, TiB]
  # The sidebar is dragged wider or narrower by its edge; widths in rem.
  sidebar:
    width_rem: 17
    min_rem: 11
    max_rem: 30
  # Width of a platform badge in lists (sidebar, settings), in rem, so the names beside it
  # line up; wide enough for the longest short label plus its glyph.
  platform_icon_width_rem: 3.5
  # One keyboard step when resizing a column or the sidebar, in rem; Shift multiplies it.
  resize_step_rem: 0.25
  resize_shift_multiplier: 4
  # The px size of a rem when the browser reports none (every browser defaults to 16).
  rem_fallback_px: 16
  # The Matching table's columns: default width and drag bounds, in rem.
  game_columns:
    keep: {rem: 2.5, min: 2.5, max: 4}
    game: {rem: 12, min: 8, max: 40}
    status: {rem: 6, min: 5, max: 12}
    versions: {rem: 4.5, min: 4, max: 8}
    source: {rem: 8, min: 5, max: 14}
    file: {rem: 15, min: 8, max: 48}
    first: {rem: 16, min: 8, max: 48}
    dat_name: {rem: 17, min: 8, max: 48}
    region: {rem: 6.5, min: 4.5, max: 16}
    languages: {rem: 6, min: 4, max: 14}
    # From titledb (Switch).
    publisher: {rem: 9, min: 5, max: 24}
    release: {rem: 6.5, min: 5, max: 10}
    revision: {rem: 5, min: 4, max: 10}
    # A content note ("content incomplete: 1 missing") is cut short; its tooltip has it whole.
    flags: {rem: 10, min: 5, max: 24}
    size: {rem: 5.5, min: 4.5, max: 10}
    match: {rem: 6.5, min: 3.5, max: 12}
    method: {rem: 9, min: 4, max: 16}
    proposed: {rem: 7, min: 5, max: 24}
  # Shown on a first visit; each browser remembers its own choice afterwards.
  game_columns_default: [keep, game, status, file, region, size, match, proposed]
  # The Conversion table's columns, the same way.
  conversion_columns:
    file: {rem: 14, min: 8, max: 48}
    contains: {rem: 8, min: 6, max: 40}
    container: {rem: 5.5, min: 4, max: 10}
    status: {rem: 7.5, min: 6, max: 14}
    output: {rem: 12, min: 8, max: 48}
    size: {rem: 5.5, min: 4.5, max: 10}
    check: {rem: 16, min: 8, max: 48}
    originals: {rem: 10, min: 6, max: 48}
    note: {rem: 12, min: 6, max: 48}
  conversion_columns_default: [file, contains, status, output, size, originals, note]
  # The Discarded table's columns, the same way.
  discarded_columns:
    reason: {rem: 8, min: 5, max: 16}
    name: {rem: 14, min: 8, max: 40}
    file: {rem: 14, min: 8, max: 48}
    size: {rem: 5.5, min: 4.5, max: 10}
    modified: {rem: 11.5, min: 8, max: 16}
    restore_to: {rem: 18, min: 8, max: 48}
    restore: {rem: 14, min: 8, max: 24}
  discarded_columns_default: [reason, name, file, size, modified, restore]
  # A set's Ignored tab: the files its ignore list leaves out.
  ignored_columns:
    name: {rem: 16, min: 8, max: 40}
    file: {rem: 18, min: 8, max: 48}
    size: {rem: 5.5, min: 4.5, max: 10}
    ignored_by: {rem: 10, min: 6, max: 24}
  ignored_columns_default: [name, file, size, ignored_by]
  # The Updates & DLC table (Switch sets): each game's updates, newest first, then its DLC.
  updates_columns:
    game: {rem: 12, min: 8, max: 40}
    name: {rem: 14, min: 8, max: 40}
    release: {rem: 5, min: 4, max: 10}
    # The newest update titledb knows for the game.
    latest: {rem: 5.5, min: 4, max: 10}
    version: {rem: 6.5, min: 4.5, max: 10}
    display_version: {rem: 6, min: 4.5, max: 12}
    title_id: {rem: 10, min: 6, max: 14}
    # Wide enough for "newest, kept · newer released".
    status: {rem: 15, min: 8, max: 30}
    # The content check ("content complete").
    notes: {rem: 10, min: 5, max: 24}
    size: {rem: 5.5, min: 4.5, max: 10}
  updates_columns_default: [game, name, display_version, size, status]
  # The Rename table: each ROM file, the name its set's template proposes, the name it had
  # before its first rename.
  rename_columns:
    name: {rem: 16, min: 8, max: 48}
    new_name: {rem: 16, min: 8, max: 48}
    original: {rem: 12, min: 6, max: 40}
    game: {rem: 14, min: 8, max: 40}
    folder: {rem: 8, min: 4, max: 30}
    status: {rem: 14, min: 8, max: 30}
    size: {rem: 5.5, min: 4.5, max: 10}
  rename_columns_default: [name, new_name, original, status, size]
  # The Statistics table: the set, its platform, and one DATs column holding a bar per DAT
  # source side by side. The DATs column starts as wide as the most sources a set has
  # (each `statistics_source_rem` wide, `statistics_source_gap_rem` apart), within its
  # min and max.
  statistics_columns:
    folder: {rem: 12, min: 6, max: 30}
    size: {rem: 6, min: 4.5, max: 10}
    discarded: {rem: 6.5, min: 4.5, max: 10}
    platform: {rem: 6, min: 4, max: 14}
    dats: {rem: 8, min: 8, max: 60}
  statistics_columns_default: [folder, size, discarded, platform, dats]
  statistics_source_rem: 7
  statistics_source_gap_rem: 0.75
  # Its missing-games table.
  missing_columns:
    name: {rem: 18, min: 8, max: 48}
    years: {rem: 6, min: 4, max: 14}
    publishers: {rem: 10, min: 6, max: 30}
    regions: {rem: 8, min: 5, max: 24}
    languages: {rem: 7, min: 4, max: 24}
    serials: {rem: 9, min: 5, max: 24}
    notes: {rem: 12, min: 5, max: 40}
    versions: {rem: 4.5, min: 4, max: 8}
  missing_columns_default: [name, years, publishers, regions, languages, notes, versions]
  # Decimals shown in a coverage percentage.
  percent_digits: 1
  # The notifications panel (bell, top right): the latest scans and runs it lists, and how
  # often it looks for new ones while nothing runs (while one runs, every poll_interval_ms).
  notifications:
    limit: 50
    idle_poll_ms: 5000

folders:
  # Folder labels name the folder in the UI and its discarded/<label>/ directory.
  label_pattern: "^[a-z0-9][a-z0-9._-]*$"
  # "Automatch folders": a subfolder named after a platform (its id, short name, name,
  # DAT name or one of platforms.profiles.<id>.aliases, compared without case, spaces or
  # punctuation) is matched to it. These names belong to platforms not supported yet: the
  # table says so instead of leaving them unmatched.
  unsupported_names:
    psvita: PlayStation Vita
    vita: PlayStation Vita
    atari-jaguar-cd: Atari Jaguar CD
    atarijaguarcd: Atari Jaguar CD
    jaguarcd: Atari Jaguar CD
    ps3: PlayStation 3
    wiiu: Wii U

# Filenames that are never touched or counted as ROMs (glob patterns, case-insensitive).
# This is each folder's starting list; its Ignored tab edits the folder's copy in library.yaml.
ignored_filenames:
  - metadata.txt
  - systeminfo.txt
  - gamelist.xml
  - "*.nfo"
  - "*.txt"
  - Thumbs.db
  - .DS_Store
  - desktop.ini

platforms:
  # The whitelist: only these platforms can be added. Wave 1 (cartridge systems).
  enabled:
    - amiga
    - atari2600
    - atari5200
    - atari7800
    - c64
    - colecovision
    - gamegear
    - gb
    - gba
    - gbc
    - genesis
    - jaguar
    - lynx
    - n64
    - 3ds
    - nds
    - neo-geo-pocket
    - neogeomvs
    - neo-geo-pocket-color
    - nes
    - ngc
    - ps2
    - psp
    - wii
    - dc
    - neo-geo-cd
    - psx
    - saturn
    - segacd
    - sega32
    - sms
    - snes
    - switch
    - tg16
    - virtualboy
    - wonderswan
    - wonderswan-color

  # Archive formats a ROM may be wrapped in.
  archive_extensions: [zip, 7z]
  # Disc image formats that are a container of their own (what a disc target produces).
  disc_formats: [chd, rvz]
  # Switch packages, each a container of its own: NSP is the target; NSZ (compressed NCAs)
  # is converted to it (switch_package.py). XCI and XCZ (game card dumps) are not supported
  # (maintainer, 2026-10-24: "a mostly dead format").
  package_formats: [nsp, nsz]
  # Images already stripped of data are never converted further (design §4), only flagged.
  lossy_patterns: ["*.nkit.*", "*.wbfs", "*.ciso"]

  # Target formats, one per platform: every file not in it is converted to it, or else
  # discarded before matching. `produces` is the container ("plain" = the bare ROM file).
  targets:
    zip:
      label: Zip (TorrentZip)
      description: One zip per game, deterministic TorrentZip format. Opened directly by the RetroArch cores.
      produces: zip
    plain:
      label: Unpacked ROM file
      description: The bare ROM file, no archive.
      produces: plain
    rvz:
      label: RVZ (Dolphin)
      description: Dolphin's lossless compressed disc format, made with dolphin-tool.
      produces: rvz
    nsp:
      label: NSP
      description: The Switch's own install package. NSZ is converted to it, every content archive kept byte for byte.
      produces: nsp
    chd:
      label: CHD (compressed disc image)
      description: One lossless compressed file per disc, made with chdman. Read by DuckStation, Beetle, Flycast, PCSX2 and PPSSPP.
      produces: chd

  # Per platform: display name, its icon (a short label and the kind of device), the
  # No-Intro DAT name, the ROM file extensions, the allowed targets and the default target.
  profiles:
    amiga:
      name: Amiga
      short: "AMI"
      kind: computer
      aliases: ["amiga500", "amiga1200", "amigaocs", "commodore amiga"]
      # No-Intro's Amiga set is floppy images in IPF (SPS) form.
      dat_name: Commodore - Amiga
      # No-Intro formats first; the rest are TOSEC formats (synthetic tests only).
      rom_extensions: [ipf, adf, adz, dms, lha, exe, hdf]
      targets: [zip, plain]
      default_target: zip
      # The TOSEC download merges the pack's DATs whose names start with these.
      tosec_prefixes: ["Commodore Amiga - Games - "]
      # TOSEC names carry dump flags ([cr], [a], [b]); No-Intro names rank the same without.
      ranking_criteria: [prerelease, dump, region]
    c64:
      name: Commodore 64
      short: "C64"
      kind: computer
      aliases: ["commodore 64", "commodore64"]
      # No-Intro's C64 set: cartridges (.crt) and disk images (.d64).
      dat_name: Commodore - 64
      # No-Intro formats first; the rest are TOSEC formats (synthetic tests only).
      rom_extensions: [crt, d64, d71, d81, g64, nib, t64, tap, prg, p00, lnx]
      targets: [zip, plain]
      default_target: zip
      # The TOSEC download merges the pack's DATs whose names start with these.
      tosec_prefixes: ["Commodore C64 - Games - "]
      # TOSEC names carry dump flags ([cr], [a], [b]); No-Intro names rank the same without.
      ranking_criteria: [prerelease, dump, region]
    atari2600:
      name: Atari 2600
      short: "2600"
      kind: console
      aliases: ["a2600", "vcs", "atari vcs"]
      dat_name: Atari - 2600
      rom_extensions: [a26, bin]
      targets: [zip, plain]
      default_target: zip
    atari5200:
      name: Atari 5200
      short: "5200"
      kind: console
      aliases: ["a5200"]
      dat_name: Atari - 5200
      rom_extensions: [a52, bin]
      targets: [zip, plain]
      default_target: zip
    atari7800:
      name: Atari 7800
      short: "7800"
      kind: console
      aliases: ["a7800"]
      dat_name: Atari - 7800
      rom_extensions: [a78, bin]
      targets: [zip, plain]
      default_target: zip
    colecovision:
      name: ColecoVision
      short: "CV"
      kind: console
      aliases: ["coleco"]
      dat_name: Coleco - ColecoVision
      rom_extensions: [col, rom, bin]
      targets: [zip, plain]
      default_target: zip
    gamegear:
      name: Game Gear
      short: "GG"
      kind: handheld
      aliases: ["gg", "sega game gear"]
      dat_name: Sega - Game Gear
      # No-Intro lists the carts that run in Master System mode as .sms.
      rom_extensions: [gg, sms]
      targets: [zip, plain]
      default_target: zip
    gb:
      name: Game Boy
      short: "GB"
      kind: handheld
      aliases: ["gameboy", "nintendo game boy"]
      dat_name: Nintendo - Game Boy
      rom_extensions: [gb]
      targets: [zip, plain]
      default_target: zip
    gba:
      name: Game Boy Advance
      short: "GBA"
      kind: handheld
      aliases: ["gameboy advance", "nintendo game boy advance"]
      dat_name: Nintendo - Game Boy Advance
      rom_extensions: [gba]
      targets: [zip, plain]
      default_target: zip
    gbc:
      name: Game Boy Color
      short: "GBC"
      kind: handheld
      aliases: ["gameboy color", "nintendo game boy color"]
      dat_name: Nintendo - Game Boy Color
      rom_extensions: [gbc]
      targets: [zip, plain]
      default_target: zip
    genesis:
      name: Mega Drive / Genesis
      short: "MD"
      kind: console
      aliases: ["megadrive", "genesis-slash-megadrive", "md", "sega genesis", "sega mega drive"]
      dat_name: Sega - Mega Drive - Genesis
      rom_extensions: [md, gen, bin, smd]
      targets: [zip, plain]
      default_target: zip
    jaguar:
      name: Atari Jaguar
      short: "JAG"
      kind: console
      aliases: ["atarijaguar", "atari jaguar"]
      dat_name: Atari - Jaguar
      rom_extensions: [j64, jag, rom, abs, cof]
      targets: [zip, plain]
      default_target: zip
    lynx:
      name: Atari Lynx
      short: "LNX"
      kind: handheld
      aliases: ["atarilynx", "atari lynx"]
      dat_name: Atari - Lynx
      # No-Intro lists aftermarket games as BLL executables, .bll.
      rom_extensions: [lnx, lyx, bll]
      targets: [zip, plain]
      default_target: zip
    n64:
      name: Nintendo 64
      short: "N64"
      kind: console
      aliases: ["nintendo64"]
      dat_name: Nintendo - Nintendo 64
      rom_extensions: [z64, v64, n64]
      targets: [zip, plain]
      default_target: zip
    "3ds":
      name: Nintendo 3DS
      short: "3DS"
      kind: handheld
      aliases: ["n3ds", "nintendo3ds"]
      dat_name: Nintendo - Nintendo 3DS
      rom_extensions: [3ds, cci, cia]
      # Azahar/Citra do not read zips: the target is the bare card image.
      targets: [plain]
      default_target: plain
      # Card images are read for encryption and trimming (`card_images`).
      card_image: ncsd
      # Encrypted images are decrypted with your own keys (`decryption`).
      decrypts: true
    nds:
      name: Nintendo DS
      short: "NDS"
      kind: handheld
      aliases: ["nintendods", "ds"]
      dat_name: Nintendo - Nintendo DS
      rom_extensions: [nds]
      targets: [zip, plain]
      default_target: zip
    neogeomvs:
      name: Neo Geo MVS
      short: "MVS"
      kind: arcade
      aliases: ["neogeo", "mvs", "neo geo"]
      dat_name: FinalBurn Neo - Neo Geo Games
      dat_family: fbneo
      dat_file: "FinalBurn Neo (ClrMame Pro XML, Neogeo only)"
      # Loose chip files; the games are the romset zips.
      rom_extensions: [bin, rom]
      romsets: true
      names_from: description
      # Set names are what emulators load: never renamed.
      rename_templates: [keep]
      rename_default: keep
      igir_merge_modes: [split, nonmerged]
      # Clones are hacks, bootlegs and other releases of the parent: parent first.
      ranking_criteria: [parent, prerelease, region]
      targets: [zip]
      default_target: zip
    neo-geo-pocket:
      name: Neo Geo Pocket
      short: "NGP"
      kind: handheld
      aliases: ["ngp", "neogeopocket"]
      dat_name: SNK - Neo Geo Pocket
      rom_extensions: [ngp]
      targets: [zip, plain]
      default_target: zip
    neo-geo-pocket-color:
      name: Neo Geo Pocket Color
      short: "NGPC"
      kind: handheld
      aliases: ["ngpc", "neogeopocketcolor"]
      dat_name: SNK - Neo Geo Pocket Color
      rom_extensions: [ngc, ngpc]
      targets: [zip, plain]
      default_target: zip
    nes:
      name: Nintendo Entertainment System
      short: "NES"
      kind: console
      aliases: ["famicom", "fc", "nintendo entertainment system"]
      dat_name: Nintendo - Nintendo Entertainment System
      rom_extensions: [nes]
      targets: [zip, plain]
      default_target: zip
    sega32:
      name: Sega 32X
      short: "32X"
      kind: console
      aliases: ["sega32x", "32x", "sega 32x"]
      dat_name: Sega - 32X
      rom_extensions: [32x, bin]
      targets: [zip, plain]
      default_target: zip
    sms:
      name: Master System
      short: "SMS"
      kind: console
      aliases: ["mastersystem", "sega master system", "mark iii"]
      dat_name: Sega - Master System - Mark III
      rom_extensions: [sms]
      targets: [zip, plain]
      default_target: zip
    snes:
      name: Super Nintendo
      short: "SNES"
      kind: console
      aliases: ["sfc", "superfamicom", "super nintendo", "supernintendo"]
      dat_name: Nintendo - Super Nintendo Entertainment System
      rom_extensions: [sfc, smc]
      targets: [zip, plain]
      default_target: zip
    switch:
      name: Nintendo Switch
      short: "NSW"
      kind: handheld
      aliases: ["nsw", "nintendo switch"]
      dat_name: Nintendo - Nintendo Switch
      rom_extensions: [nsp, nsz]
      # One format: NSP (maintainer, 2026-10-24: "we are not supporting XCI or NSZ").
      targets: [nsp]
      default_target: nsp
      title_ids: true
      rename_default: switch
      # No public Switch DAT exists: files are identified by title ID.
      dat_download: false
    tg16:
      name: PC Engine / TurboGrafx-16
      short: "PCE"
      kind: console
      aliases: ["pcengine", "pce", "turbografx16", "turbografx", "turbografx-16"]
      dat_name: NEC - PC Engine - TurboGrafx 16
      side_dats:
        supergrafx: {dat_name: "NEC - PC Engine SuperGrafx"}
      rom_extensions: [pce, sgx]
      targets: [zip, plain]
      default_target: zip
    virtualboy:
      name: Virtual Boy
      short: "VB"
      kind: handheld
      aliases: ["vb", "nintendo virtual boy"]
      dat_name: Nintendo - Virtual Boy
      rom_extensions: [vb]
      targets: [zip, plain]
      default_target: zip
    dc:
      name: Dreamcast
      short: "DC"
      kind: console
      aliases: ["dreamcast", "sega dreamcast"]
      dat_name: Sega - Dreamcast
      dat_family: redump
      redump_system: dc
      side_dats:
        nonredump: {system: 165, dat_name: "Non-Redump - Sega - Dreamcast"}
      # GD-ROMs: Redump's cue sheets (with the high-density area) or a .gdi and its tracks.
      # .cdi: DiscJuggler CD-R images; no lossless conversion to CHD exists, so they are
      # listed for discarding.
      rom_extensions: [chd, cue, gdi, bin, raw, cdi]
      part_extensions: [cue, gdi, bin, raw]
      # Scene CDI archives come with .url, .nfo, .txt files.
      excess_files: true
      targets: [chd]
      default_target: chd
      # TOSEC lists CDIs, prototypes and homebrew Redump does not (Firmware and Various
      # Unverified Dumps left out).
      tosec_dir: "TOSEC-ISO/"
      tosec_prefixes: ["Sega Dreamcast - Games - ", "Sega Dreamcast - Homebrew - ",
                       "Sega Dreamcast - Demos - ", "Sega Dreamcast - Applications - ",
                       "Sega Dreamcast - Multimedia - ", "Sega Dreamcast - Samplers - "]
    psx:
      name: PlayStation
      short: "PS1"
      kind: console
      aliases: ["ps1", "ps", "playstation", "sony playstation"]
      dat_name: Sony - PlayStation
      dat_family: redump
      redump_system: psx
      side_dats:
        nonredump: {system: 168, dat_name: "Non-Redump - Sony - PlayStation"}
      rom_extensions: [chd, cue, bin, iso]
      part_extensions: [cue, bin]
      targets: [chd]
      default_target: chd
    saturn:
      name: Saturn
      short: "SAT"
      kind: console
      aliases: ["ss", "sega saturn"]
      dat_name: Sega - Saturn
      dat_family: redump
      redump_system: ss
      side_dats:
        nonredump: {system: 167, dat_name: "Non-Redump - Sega - Sega Saturn"}
      rom_extensions: [chd, cue, bin, iso]
      part_extensions: [cue, bin]
      targets: [chd]
      default_target: chd
    segacd:
      name: Sega CD
      short: "SCD"
      kind: console
      aliases: ["megacd", "sega cd", "mega cd"]
      dat_name: Sega - Mega CD & Sega CD
      dat_family: redump
      redump_system: mcd
      side_dats:
        nonredump: {system: 166, dat_name: "Non-Redump - Sega - Sega Mega CD + Sega CD"}
      rom_extensions: [chd, cue, bin, iso]
      part_extensions: [cue, bin]
      targets: [chd]
      default_target: chd
    neo-geo-cd:
      name: Neo Geo CD
      short: "NGCD"
      kind: console
      aliases: ["neogeocd"]
      dat_name: SNK - Neo Geo CD
      dat_family: redump
      redump_system: ngcd
      rom_extensions: [chd, cue, bin, iso]
      part_extensions: [cue, bin]
      targets: [chd]
      default_target: chd
    ngc:
      name: GameCube
      short: "GC"
      kind: console
      aliases: ["gc", "gamecube", "nintendo gamecube"]
      dat_name: Nintendo - GameCube
      dat_family: redump
      redump_system: gc
      side_dats:
        nonredump: {system: 160, dat_name: "Non-Redump - Nintendo - Nintendo GameCube"}
      rom_extensions: [rvz, iso, gcm]
      targets: [rvz]
      default_target: rvz
    wii:
      name: Wii
      short: "Wii"
      kind: console
      aliases: ["nintendo wii"]
      dat_name: Nintendo - Wii
      dat_family: redump
      redump_system: wii
      side_dats:
        nonredump: {system: 161, dat_name: "Non-Redump - Nintendo - Wii"}
      rom_extensions: [rvz, iso, wbfs]
      targets: [rvz]
      default_target: rvz
    ps2:
      name: PlayStation 2
      short: "PS2"
      kind: console
      aliases: ["playstation2", "sony playstation 2"]
      dat_name: Sony - PlayStation 2
      dat_family: redump
      redump_system: ps2
      side_dats:
        nonredump: {system: 169, dat_name: "Non-Redump - Sony - PlayStation 2"}
      rom_extensions: [chd, cue, bin, iso, cso]
      part_extensions: [cue, bin]
      iso_mode: dvd
      targets: [chd]
      default_target: chd
    psp:
      name: PlayStation Portable
      short: "PSP"
      kind: handheld
      aliases: ["playstationportable", "sony playstation portable"]
      dat_name: Sony - PlayStation Portable
      dat_family: redump
      redump_system: psp
      side_dats:
        nonredump: {system: 62, dat_name: "Non-Redump - Sony - PlayStation Portable"}
        psn: {dat_name: "Sony - PlayStation Portable (PSN)"}
      rom_extensions: [chd, iso, cso]
      iso_mode: dvd
      targets: [chd]
      default_target: chd
    wonderswan:
      name: WonderSwan
      short: "WS"
      kind: handheld
      aliases: ["ws", "wswan"]
      dat_name: Bandai - WonderSwan
      rom_extensions: [ws]
      targets: [zip, plain]
      default_target: zip
    wonderswan-color:
      name: WonderSwan Color
      short: "WSC"
      kind: handheld
      aliases: ["wsc", "wswanc", "wonderswancolor"]
      dat_name: Bandai - WonderSwan Color
      rom_extensions: [wsc]
      targets: [zip, plain]
      default_target: zip

dats:
  # DAT files are stored under <data_dir>/<directory>/<platform>/<sha1>.dat.
  directory: dats
  # Who makes a platform's DATs (platforms.profiles.<id>.dat_family).
  families:
    nointro: {label: No-Intro, libretro_dir: no-intro, clonelist_suffix: (No-Intro)}
    redump: {label: Redump, libretro_dir: redump, clonelist_suffix: (Redump)}
    fbneo: {label: FinalBurn Neo, libretro_dir: fbneo-split, clonelist_suffix: (FBNeo)}
    tosec: {label: TOSEC, libretro_dir: tosec, clonelist_suffix: (TOSEC)}
  sources:
    libretro:
      label: libretro-database mirror
      short_label: libretro
      # {family} is the family's libretro_dir, {name} the platform's DAT name.
      url_template: "https://raw.githubusercontent.com/libretro/libretro-database/master/metadat/{family}/{name}.dat"
      # The mirror has no parent/clone data and lists headered and headerless NES
      # entries separately: good for identifying files, not for grouping versions.
      # It keeps one ROM per game (a disc's data track, one disk of a multi-disk game),
      # so a set kept whole in an archive does not match it: disc DATs come from
      # redump.info.
      identification_only: true
      families: [nointro]
    nointro:
      label: No-Intro (DAT-o-MATIC)
      short_label: No-Intro
      website: "https://datomatic.no-intro.org/index.php?page=download&s=64&op=daily"
      identification_only: false
      families: [nointro]
    redump:
      label: redump.info
      short_label: Redump
      # One request per click; {system} is the platform's redump_system. The answer is a zip
      # holding one Logiqx DAT with serials and categories.
      url_template: "https://redump.info/datfile/{system}/serial,version"
      website: "https://redump.info/downloads.php"
      identification_only: false
      families: [redump]
    fbneo:
      label: FinalBurn Neo (GitHub)
      short_label: FBNeo
      # {dat_file} is the platform's dat_file. Parent/clone and BIOS data included.
      url_template: "https://raw.githubusercontent.com/libretro/FBNeo/master/dats/{dat_file}.dat"
      website: "https://github.com/libretro/FBNeo/tree/master/dats"
      identification_only: false
      families: [fbneo]
    tosec:
      label: TOSEC (tosecdev.org)
      short_label: TOSEC
      website: "https://www.tosecdev.org/downloads"
      # The newest release page, then its complete DAT pack (about 100 MB, every system).
      index_url: "https://www.tosecdev.org/downloads"
      release_pattern: 'href="(/downloads/category/[0-9]+-[0-9]{4}-[0-9]{2}-[0-9]{2})"'
      pack_pattern: 'href="([^"]*download=[^"]*tosec-dat-pack-complete[^"]*)"'
      member_dir: "TOSEC/"
      cache_dir: cache/tosec
      timeout_seconds: 600
      identification_only: false
      families: [tosec]
    nonredump:
      label: No-Intro Non-Redump (DAT-o-MATIC)
      short_label: Non-Redump
      # Discs Redump does not list (prototypes, betas, unlicensed). DAT-o-MATIC serves its
      # DATs to a browser only: the button opens this page, the file is then uploaded.
      page_template: "https://datomatic.no-intro.org/index.php?page=download&op=dat&s={system}"
      website: "https://datomatic.no-intro.org/index.php?page=download&op=dat"
      identification_only: false
      side: true
    psn:
      label: No-Intro PSN (libretro-database mirror)
      short_label: PSN
      # Digital-only releases. The mirror's copy has no parent/clone data; each game is one
      # decrypted image (games kept as an EBOOT.PBP folder are listed by their files).
      url_template: "https://raw.githubusercontent.com/libretro/libretro-database/master/metadat/no-intro/{name}.dat"
      identification_only: true
      side: true
    supergrafx:
      label: No-Intro SuperGrafx (libretro-database mirror)
      short_label: SuperGrafx
      # HuCards that need the SuperGrafx; No-Intro keeps them out of the PC Engine DAT.
      # The mirror's copy has no parent/clone data.
      url_template: "https://raw.githubusercontent.com/libretro/libretro-database/master/metadat/no-intro/{name}.dat"
      identification_only: true
      side: true
    upload:
      label: Uploaded file
      short_label: uploaded DAT
      identification_only: false
  # A DAT belongs to a platform when its header name is the platform's dat_name, alone or
  # followed by these format variants (No-Intro's daily pack: "Nintendo - Nintendo 64
  # (BigEndian)", "... (Headered) (Parent-Clone)"). Any other suffix names a different set
  # ("Nintendo - Wii (Development Kit Hard Drives)", "... (Digital) (CDN)"), never the platform.
  variant_suffixes:
    - "(Headered)"
    - "(Headerless)"
    - "(Parent-Clone)"
    - "(BigEndian)"
    - "(ByteSwapped)"
    - "(Decrypted)"
    - "(Encrypted)"
  download_timeout_seconds: 60
  max_upload_bytes: 536870912
  user_agent: "1g1r-webui"
  # A newly downloaded or uploaded version becomes active only when you choose it,
  # except the first DAT of its source for a platform.
  auto_activate_new: false
  # The order a platform's sources identify files in, until you change it (Matching page or
  # Settings -> DATs): each source tries the files still unmatched. Complete curated DATs
  # first; libretro keeps one ROM per game; TOSEC names differ from all the others; then the
  # online lookups. Each platform has one active version per source.
  priority: [nointro, upload, redump, nonredump, psn, supergrafx, fbneo, libretro, tosec, hasheous]

# Switch names and details from blawar/titledb (MIT): one JSON file per eShop country and
# language, keyed by eShop ID, each entry carrying its title ID. A downloaded file is kept
# as a small DAT (one game per title ID, no checksums) and is one entry of the platform's
# order, named "<entry_prefix><file>"; the first file listing a title ID names it.
titledb:
  label: titledb (GitHub)
  short_label: titledb
  website: "https://github.com/blawar/titledb"
  url_template: "https://raw.githubusercontent.com/blawar/titledb/master/{file}.json"
  # Country -> languages: every "<country>.<language>" file there is.
  languages_url: "https://raw.githubusercontent.com/blawar/titledb/master/languages.json"
  # Every update version released per title ID, with its date; fetched with each region
  # file and kept as <dats directory>/<platform>/<versions_file>.
  versions_url: "https://raw.githubusercontent.com/blawar/titledb/master/versions.json"
  versions_file: titledb-versions.json
  # The content archives (NCAs) of every title ID and version, fetched and kept the same way;
  # a scan compares each NSP's NCA names with them (names only, nothing is hashed).
  contents_url: "https://raw.githubusercontent.com/blawar/titledb/master/cnmts.json"
  contents_file: titledb-contents.json
  # Content types an NSP may leave out (delta fragments of an update).
  optional_content_types: [6]
  entry_prefix: "titledb:"
  file_pattern: '^[A-Z]{2}\.[a-z]{2}$'
  # Offered as buttons; the others are picked from a list.
  featured: [US.en, JP.ja]
  timeout_seconds: 600
  # A region file is about 90 MB.
  max_download_bytes: 268435456
  # The languages list is fetched again after this many seconds.
  languages_ttl_seconds: 86400
  # Marks dropped or replaced in names; square brackets would end the name in a file's
  # stored identity, so they become parentheses.
  name_replacements: {"™": "", "®": "", "©": "", "[": "(", "]": ")"}
  release_format: "%Y%m%d"
  release_display: "%Y-%m-%d"
  game_category: Games
  demo_category: Demo
  # The DAT's description: "<file> as of <date>".
  version_format: "%Y-%m-%d"

igir:
  binary: igir
  # igir's checksum caches, one file per folder, relative to the data directory. igir saves
  # its cache every few minutes, so a run that is stopped keeps most of what it hashed.
  cache_dir: cache/igir
  # Scratch space for igir's report files, relative to the data directory.
  work_dir: cache/igir-work
  # igir's time limit for one run: this, plus the folder's size read at min_bytes_per_second
  # (igir decompresses each CHD to hash it; a large disc library takes hours the first time).
  timeout_seconds: 3600
  min_bytes_per_second: 2097152
  # Ceiling on that limit (20 days). Python waits on igir with poll(), which takes the
  # limit in milliseconds as a 32-bit int (about 24.8 days); above it a scan of a folder
  # over about 4.5 TB failed with "timeout is too large".
  max_timeout_seconds: 1728000
  # Threads per igir run when set in Settings -> Advanced: files read at once
  # (--reader-threads) and Node's worker pool for reads and CHD decoding
  # (UV_THREADPOOL_SIZE). Unset, igir uses its own: these two.
  default_reader_threads: 6
  default_pool_threads: 4
  max_threads: 64

# Hashing a file's ROM data (lookups, duplicates, header and byte-order checks) reads it
# this many bytes at a time, whatever the file's size.
hashing:
  chunk_bytes: 1048576
  # Looking for identical copies first compares the SHA1 of each file's first bytes (this
  # many): only files whose size and first bytes are equal are read whole.
  probe_bytes: 1048576
  # Files hashed at the same time (each read once, by one thread). Reading waits on the
  # disk more than on the CPU, so a few run side by side even on a small machine.
  workers: 4

# Online identification for files the local DAT misses. Off until switched on in
# Settings -> Online lookups; only content hashes (CRC32, MD5, SHA1) are sent.
lookups:
  # A CHD is looked up by its largest data track, as Redump lists it: the tracks are
  # streamed through igir's chdman library by a helper script, nothing is written to disk.
  # The compressed file's own hash is never sent (no database lists it).
  chd:
    node: node
    script: /usr/local/lib/g1r/chd-hashes.mjs
    chdman_module: /usr/local/lib/node_modules/igir/dist/addons/chdman/index.js
    chunk_bytes: 1048576
    # One CHD may take this long, plus its size read at min_bytes_per_second.
    timeout_seconds: 600
    min_bytes_per_second: 2097152
    # Track types never looked up (audio tracks are shared between releases).
    audio_track_types: [AUDIO]
  hasheous:
    url: https://hasheous.org/api/v1/Lookup/ByHash?returnAllSources=true&returnFields=Signatures
    site: https://hasheous.org
    timeout_seconds: 30
    user_agent: 1g1r-webui
    # Hasheous sources that may identify a file, in order of preference. An answer counts
    # only when its system is the platform's DAT. `name_from` says where the DAT name is:
    # the ROM's file name (one ROM per game: No-Intro) or the game's description (discs,
    # whose ROMs are tracks: Redump). Hasheous's descriptions can lag behind a revision.
    # The others name systems and games their own way ("Nintendo Game Boy", "Game Boy"): an
    # answer counts when its system is the platform (its DAT name, name or an alias, compared
    # without case and punctuation) and a name it gives is listed by one of the platform's
    # DATs (trust: dat_name). Any other name it gives becomes a suggestion.
    sources:
      NoIntros: {label: No-Intro, name_from: rom}
      Redump: {label: Redump, name_from: game}
      TOSEC: {label: TOSEC, name_from: rom, trust: dat_name}
      RetroAchievements: {label: RetroAchievements, name_from: rom, trust: dat_name}
      ScreenScraper: {label: ScreenScraper, name_from: rom, trust: dat_name}
      MAMEMess: {label: MAME software lists, name_from: game, trust: dat_name}
      WHDLoad: {label: WHDLoad, name_from: game, trust: dat_name}
    # A "not found" answer is asked again after this many days; found answers are kept.
    not_found_ttl_days: 30

# Name suggestions for unmatched files. They never identify anything unless
# auto_match_threshold is set (a score from 0 to 1).
fuzzy:
  min_score: 0.6
  max_suggestions: 3
  auto_match_threshold: null

archives:
  # Zip members are read directly; 7z archives are listed with 7-Zip.
  seven_zip_binary: 7z
  list_timeout_seconds: 300

chdman:
  binary: chdman
  # One createcd/createdvd, verify or extract run must finish within this many seconds.
  timeout_seconds: 7200
  # Extra options for createcd/createdvd, e.g. ["--numprocessors", "4"]; empty: chdman's
  # own defaults (its standard codecs and hunk size).
  create_args: []

dolphin:
  binary: dolphin-tool
  user_dir: cache/dolphin
  # One convert or verify run must finish within this many seconds.
  timeout_seconds: 7200
  # Dolphin's suggested RVZ settings: 128 KiB blocks, zstd level 5.
  convert_args: ["-f", "rvz", "-b", "131072", "-c", "zstd", "-l", "5"]

jobs:
  # Folder scans run in the background, this many at a time (each on its own folder) unless
  # set in Settings -> Advanced, up to max_scan_workers.
  scan_workers: 4
  max_scan_workers: 16
  # Runs that change files run apart from scans, so none waits behind a long scan.
  # Conversion runs go one at a time across every folder: each run's free-space check stays
  # true while it runs, and they are the heavy disk and CPU work. A conversion waiting for
  # another folder's says which one it waits for.
  conversion_runs: 1
  # Every other run (1G1R apply, moving or deleting files, emptying discarded/, restore) needs
  # no free space and starts at once, one per folder; at most this many at a time.
  other_runs: 16
  # Inside a conversion run, this many files convert at a time, each through its whole
  # pipeline (unpack, convert, verify, move or delete the original), unless set in
  # Settings -> Advanced, up to max_conversion_workers.
  conversion_workers: 2
  max_conversion_workers: 8
  # A running scan writes how far it is at most this often.
  progress_interval_seconds: 0.5

apply:
  # Moves to another disk copy in chunks of this many bytes, hashing as they go.
  copy_chunk_bytes: 1048576
  # A copy is written under this suffix beside its destination and renamed once verified;
  # one left behind by a restart is removed at start-up.
  temp_suffix: .g1r-part
  # Conversions: a ROM wrapped in a zip is deflated at this level (0 stores, 9 is smallest).
  zip_compress_level: 9
  # Taking one ROM out of a 7z archive must finish within this many seconds; unpacking a
  # whole archive to repack it gets this plus its size read at extract_min_bytes_per_second.
  extract_timeout_seconds: 600
  extract_min_bytes_per_second: 2097152
  # Disc conversions unpack and check tracks in a work directory with this suffix, beside
  # the output; removed when done, and at start-up if a restart left one.
  work_suffix: .g1r-work
  # Stopping a conversion: a tool still converting a file (chdman, dolphin-tool, 7-Zip) is
  # killed within this many seconds, and what it wrote is deleted.
  stop_poll_seconds: 0.5

# Copier/emulator headers some ROM files carry in front of the data. When igir finds no
# match, the header is stripped and the remaining data looked up in the DAT by CRC and size.
# A rule applies when the magic bytes are found at magic_offset, or (when no magic is
# given) when the file size modulo size_modulus equals header_size.
headers:
  nes:
    - {magic_hex: "4e45531a", magic_offset: 0, header_size: 16}
  atari7800:
    - {magic_hex: "415441524937383030", magic_offset: 1, header_size: 128}
  lynx:
    - {magic_hex: "4c594e58", magic_offset: 0, header_size: 64}
  snes:
    - {size_modulus: 1024, header_size: 512}

# Platforms whose dumps come in several byte orders. The DAT lists the native order (and
# may list others); a file is recognised by the magic bytes at magic_offset, never by its
# extension. A swapped file's data is matched, hashed and compared in the native order, and
# its conversion rewrites it in that order under native_extension. Swapping reverses the
# bytes of every word_bytes-long word.
byte_orders:
  n64:
    magic_offset: 0
    native_magic_hex: "80371240"
    native_extension: z64
    swapped:
      - {label: byte-swapped (v64), magic_hex: "37804012", word_bytes: 2}
      - {label: little-endian, magic_hex: "40123780", word_bytes: 4}

# Nintendo Switch title IDs (platforms.profiles.<id>.title_ids). A base game's ID has the
# low_hex bits zero; its update adds update_low_hex; its DLC sit dlc_step_hex above it. An
# NSP/NSZ (PFS0) is read for its unencrypted content metadata ("<id>.cnmt.xml": Id and
# Version), else its ticket ("<rights ID>.tik", the title ID first, no version). The file
# name is never read for either; the name shown is the file name up to its first tag. The
# patterns read back the identity names the scan stores ("<name> [<ID>][v<version>]", then
# "[d1.0.2]", the version shown to players, when prod.keys gave it).
title_ids:
  digits: 16
  radix: 16
  rights_id_digits: 32
  low_hex: fff
  update_low_hex: "800"
  dlc_step_hex: "1000"
  name_pattern: '\[(0[0-9A-Fa-f]{15})\]'
  version_pattern: '\[v([0-9]+)\]'
  display_prefix: d
  display_pattern: '\[d([^\]]+)\]'
  name_end_pattern: '\s*\['
  pfs0_magic: PFS0
  pfs0_header: "<4sIII"
  pfs0_entry: "<QQII"
  max_entries: 4096
  ticket_suffix: .tik
  cnmt_xml_suffix: .cnmt.xml
  # Content archives in a PFS0 ("<content ID>.nca", compressed ".ncz"); the content
  # metadata's own archive is "<id>.cnmt.nca".
  nca_suffixes: [.nca, .ncz]
  cnmt_nca_suffix: .cnmt.nca
  # Each update release adds this to the version (v65536 is the first update).
  version_step: 65536
  max_cnmt_xml_bytes: 1048576
  pfs0_extensions: [nsp, nsz]

# Card image formats whose header the scan reads (platforms.profiles.<id>.card_image).
# NCSD (Nintendo 3DS .3ds/.cci): the image size and the first partition's offset are
# little-endian u32 counts of media units of media_unit_bytes << flags[media_unit_flag]; the
# first partition is an NCCH, encrypted unless its flags[crypto_flag] has no_crypto_mask.
# The NCCH's product code is plain text: an encrypted image that cannot be decrypted (which
# never has the DAT's hash, the DAT listing decrypted images) is suggested the DAT entries
# with that serial.
card_images:
  ncsd:
    magic: NCSD
    magic_offset: 256
    image_size_offset: 260
    partition_table_offset: 288
    flags_offset: 392
    media_unit_flag: 6
    media_unit_bytes: 512
    ncch_magic: NCCH
    ncch_magic_offset: 256
    ncch_flags_offset: 392
    crypto_flag: 7
    no_crypto_mask: 4
    product_code_offset: 336
    product_code_bytes: 16
    # The partition table: partition_count entries (offset, size: u32 media units each).
    partition_count: 8
    partition_entry_bytes: 8
    # A title encrypted with a seed (digital releases) has seed_mask in flags[crypto_flag];
    # its seed is looked up in seeddb by the NCCH's program ID (little-endian u64).
    seed_mask: 32
    program_id_offset: 280
    program_id_bytes: 8
    # A decrypted image proves itself with its own SHA-256s (P10, prototype checked on a
    # retail card): per NCCH partition the extended header, the logo, the ExeFS superblock and
    # each ExeFS file, the RomFS superblock and every block of its IVFC hash tree. Offsets are
    # from the partition's start (header fields) or the region's start; regions are in media
    # units. Values from 3dbrew (hex in the comments).
    proof:
      hash_bytes: 32
      ncch_header_bytes: 512                # 0x200, the extended header follows it
      exheader_hash_offset: 352             # 0x160
      exheader_size_offset: 384             # 0x180
      exheader_hashed_bytes: 1024           # 0x400
      logo_hash_offset: 304                 # 0x130
      logo_region_offset: 408               # 0x198, then its size (u32 each)
      exefs_region_offset: 416              # 0x1A0, then its size
      exefs_hash_region_offset: 424         # 0x1A8, media units hashed for the superblock
      exefs_hash_offset: 448                # 0x1C0
      romfs_region_offset: 432              # 0x1B0, then its size
      romfs_hash_region_offset: 440         # 0x1B8
      romfs_hash_offset: 480                # 0x1E0
      # ExeFS header: exefs_files entries (name, offset, size), the files' hashes stored
      # from its end backwards (file i's hash ends hash_bytes * i before the end).
      exefs_header_bytes: 512
      exefs_files: 10
      exefs_entry_bytes: 16
      exefs_name_bytes: 8
      # RomFS IVFC header: master hash size, then ivfc_levels entries of (logical offset u64,
      # size u64, log2 block size u32, reserved). The master hash follows the header; in the
      # file come the last level (the data) aligned to its block size, then the others in
      # order. Each level's blocks, zero-padded to the block size, are hashed by the level
      # before it (the first by the master hash).
      ivfc_magic: IVFC
      ivfc_header_bytes: 96                 # 0x60
      ivfc_master_size_offset: 8
      ivfc_levels_offset: 12
      ivfc_levels: 3
      ivfc_level_bytes: 24
      ivfc_level_size_offset: 8
      ivfc_level_block_offset: 16
      read_chunk_bytes: 4194304
      # Where a damaged image fails, in messages: in these units.
      report_unit: MB
      report_unit_bytes: 1048576

# Nintendo 3DS decryption (a conversion of encrypted card images). The keys are your own,
# added on a 3DS folder's Conversion page and kept in the data directory: boot9 dumped from
# your console (GodMode9 saves boot9.bin, or boot9_prot.bin, its protected half), and seeddb
# for seed-encrypted titles. The app ships none. The decrypted image must match its own
# hashes (card_images.ncsd.proof), or nothing changes; no DAT is needed.
decryption:
  keys_dir: keys
  boot9_file: boot9_prot.bin
  boot9_sizes: [32768, 65536]
  protected_bytes: 32768
  seeddb_file: seeddb.bin
  seeddb_header_bytes: 16
  seeddb_count_bytes: 4
  seeddb_entry_bytes: 32
  # Each entry starts with the title's ID (little-endian u64), then its seed.
  seeddb_title_id_bytes: 8
  max_upload_bytes: 16777216
  # Octal: only the app's user may read the stored keys.
  file_mode: 0600
  output_suffix: " (Decrypted)"

# Switch content archives (NCA), read with the user's own prod.keys (added on a Switch set's
# Updates tab, kept in decryption.keys_dir): the content metadata of an NSP/NSZ without a
# cnmt.xml (title ID and version), and the version shown to players ("1.0.2") from its
# control data. The app ships no keys. Layout as hactool reads it: a 0xC00-byte header in
# AES-XTS (Nintendo's tweak: the sector number big-endian), sections in AES-CTR keyed from
# the decrypted key area, or from the ticket's title key when the NCA has a rights ID.
nca:
  keys_file: prod.keys
  # "name = hex" lines; the two prefixes are followed by the key generation in hex.
  header_key: header_key
  key_area_key_prefix: key_area_key_application_
  titlekek_prefix: titlekek_
  generation_radix: 16
  header_key_bytes: 32
  key_bytes: 16
  header_bytes: 0xC00
  # The XTS sector, and the unit of section offsets.
  sector_bytes: 0x200
  # GF(2^128) reduction of the XTS tweak (x^128 = x^7 + x^2 + x + 1).
  xts_reduction: 0x87
  xts_tweak_bits: 128
  magic_offset: 0x200
  magic: NCA3
  # Content type (u8), key generation (u8), key area key index (u8), second key generation.
  content_type_offset: 0x205
  meta_type: 1
  control_type: 2
  key_generation_offset: 0x206
  key_area_index_offset: 0x207
  key_generation2_offset: 0x220
  rights_id_offset: 0x230
  # Four section entries: start and end in sectors, padding.
  sections: 4
  section_table_offset: 0x240
  section_entry: "<II8x"
  key_area_offset: 0x300
  ctr_key_index: 2
  # Four filesystem headers, one per section: partition type, fs type, crypt type at 2..4.
  fs_header_offset: 0x400
  fs_header_bytes: 0x200
  fs_kinds: "<2xBBB"
  crypt_ctr: 3
  # Where the section's data starts and its size (u64 each), inside the fs header: the PFS0
  # superblock's pfs0 offset, or the last IVFC level of a RomFS.
  pfs0_range_offset: 0x40
  romfs_range_offset: 0x90
  range: "<QQ"
  # The counter's upper half, stored byte-reversed; the lower half is the offset / 16.
  section_ctr_offset: 0x140
  section_ctr_bytes: 8
  ctr_shift: 4
  aes_block_bytes: 16
  # RomFS: the file table's offset and size, and where file data starts (u64 each).
  romfs_header: "<56xQQQ"
  romfs_file: "<IIQQII"
  romfs_name_align: 4
  nacp_name: control.nacp
  display_version_offset: 0x3060
  display_version_bytes: 0x10
  cnmt_suffix: .cnmt
  nca_suffix: .nca
  # The content metadata's header: title ID, version.
  cnmt_header: "<QI"
  # A common ticket's encrypted title key, and the type byte saying common (0).
  ticket_titlekey_offset: 0x180
  ticket_type_offset: 0x281
  ticket_common: 0
  # Bounds on what is read from one file.
  max_read_bytes: 4194304

# Switch packages converted to NSP (switch_package.py). An NSZ is a PFS0 like an NSP whose
# NCZ members are NCAs decrypted and compressed with zstd (nsz's format): the first
# ncz_header_bytes are the NCA's own, then "NCZSECTN", a section count and one entry per
# section (offset, size, crypto type, padding: u64 each; key, counter: 16 bytes each), an
# optional "NCZBLOCK" header (version, type, unused, block size exponent: u8; block count:
# u32; decompressed size: u64; one u32 compressed size per block), then the zstd data. The
# sections of crypto type ctr_crypto_types are encrypted again with AES-CTR (counter: the
# entry's first 8 bytes, then the NCA offset / 16). Every NCA is proven by its name: the
# first half of its SHA-256 (content ID), read back from the written NSP.
switch_package:
  ncz_header_bytes: 0x4000
  section_magic: NCZSECTN
  block_magic: NCZBLOCK
  count: "<Q"
  section: "<QQQ8x16s16s"
  block_header: "<BBBBIQ"
  block_size: "<I"
  ctr_crypto_types: [3, 4]
  counter_prefix_bytes: 8
  ncz_suffix: .ncz
  nca_suffix: .nca
  cnmt_suffix: .cnmt.nca
  max_entries: 4096
  # The written PFS0's header is padded to a multiple of this.
  pfs0_align: 0x10
  # A content ID is this many hex digits of the SHA-256.
  content_id_digits: 32
  chunk_bytes: 4194304

# CSO (CISO v0/v1), the PlayStation 2 and PSP compressed ISO: a header, then one index entry
# per block plus one (the end), each the block's offset >> the header's index shift. A block
# is raw deflate, or stored as it is when its entry has plain_bit set. Decoded to an ISO
# in a work folder before chdman makes the CHD; v2 and ZSO (LZ4) are not read.
cso:
  magic: CISO
  header: "<4sIQIBB2x"
  index_entry: "<I"
  versions: [0, 1]
  plain_bit: 31
  window_bits: -15

# Reading No-Intro / Redump names: "Title (Region) (Languages) (Rev 1) (Beta) ...".
names:
  regions: [World, USA, Europe, Japan, Asia, Australia, Brazil, Canada, China, France,
            Germany, Hong Kong, Italy, Korea, Netherlands, Spain, Sweden, Taiwan,
            United Kingdom, UK, Russia, Scandinavia, Latin America, Mexico, Argentina,
            Austria, Belgium, Denmark, Finland, Greece, India, Ireland, Israel, Norway,
            Poland, Portugal, Switzerland, Unknown]
  # A tag starting with one of these words marks a pre-release (e.g. "Beta 2", "Proto 1").
  prerelease_tags: [Demo, Beta, Proto, Sample, Kiosk, Preview, Pre-production]
  # A tag containing one of these marks a re-release (a rip from a later collection).
  rerelease_tags: [Virtual Console, Switch Online, Namco Museum Archives, Rockman 123,
                   Retro-Bit, Evercade, Collection, Classic Mini, Disney Classic Games,
                   QUByte Classics, Capcom Town, Limited Run]
  # Tags that never separate two versions into different games when grouping by name
  # (a tag matches when it equals one of these or starts with it plus a space: "Alt 2").
  neutral_tags: [Alt, SGB Enhanced, GB Compatible, Rumble Version, NP]
  # TOSEC names (platforms.profiles.<id>.name_style: tosec).
  tosec:
    countries: {US: USA, EU: Europe, JP: Japan, GB: UK, DE: Germany, FR: France, IT: Italy,
                ES: Spain, NL: Netherlands, SE: Sweden, "NO": Norway, DK: Denmark, FI: Finland,
                AU: Australia, CA: Canada, BR: Brazil, KR: Korea, CN: China, TW: Taiwan,
                AT: Austria, BE: Belgium, CH: Switzerland, PL: Poland, PT: Portugal,
                RU: Russia, CZ: Czech Republic, HU: Hungary, GR: Greece, IE: Ireland}
    prerelease: [demo, demo-playable, demo-rolling, demo-slideshow, alpha, beta, preview,
                 pre-release, proto]
    neutral: [PAL, NTSC, PAL-NTSC, NTSC-PAL, CW, CW-R, FW, GW, GW-R, LW, PD, SW, SW-R]
    # [!] verified, then no flag, then alternate, cracked/fixed, trained/hacked/modified/
    # pirated/translated, and bad, over- or underdumped or virus-infected last.
    dump_flag_rank: {"!": 0, a: 2, cr: 3, f: 3, t: 4, h: 4, m: 4, p: 4, tr: 4, b: 5, o: 5,
                     u: 5, v: 5}
    clean_rank: 1

# Statistics (the Statistics page): how much of each local DAT a folder covers. Only games
# count; a DAT entry is left out when any of these says it is no game.
statistics:
  # DAT categories (Redump, No-Intro DAT-o-MATIC) that are games; an entry in another
  # category (Demos, Applications, Coverdiscs...) is left out. Entries without one count.
  categories: [Games]
  # A tag of the entry's name, description or ROM names starting with one of these words
  # leaves it out ("Beta 2", "Proto, Unl"). Unl is not here: unlicensed releases are games.
  excluded_tags: [Demo, Beta, Proto, Sample, Kiosk, Preview, Pre-production, Aftermarket,
                  Pirate, Program, BIOS, Hack, Bootleg]
  # TOSEC names: these dump flags (cracked, fixed, hacked, modified, pirated, trained,
  # translated, bad, over- and underdumped, virus) leave an entry out, as does a
  # pre-release (names.tosec.prerelease).
  tosec_excluded_flags: [cr, f, h, m, p, t, tr, b, o, u, v]
  # The first tag of a TOSEC name is its year when it matches this ("1987", "19xx").
  tosec_year_pattern: "^[0-9x]{4}"
  # The missing games' Obs column lists the versions' other name tags; these read better
  # spelled out.
  note_labels: {Unl: Unlicensed}

grouping:
  # When a DAT has no parent/clone data and Retool has no entry, versions are grouped by
  # their DAT name with region, language, revision, pre-release, re-release and neutral
  # tags removed. Every other tag (e.g. a publisher) keeps games apart.
  infer_from_dat_names: true
  # Retool's clone lists ("<DAT name> (No-Intro).json" or "(Redump).json"), bundled in the image.
  retool_clonelists_dir: /opt/retool/clonelists

# How the version to keep is picked. This is the template a new folder starts from;
# each folder then has its own copy, edited on its Matching page.
ranking:
  # Applied in this order; a criterion not listed is off.
  criteria: [prerelease, region]
  regions: [World, USA, Europe, Japan]
  languages: [En]
  # A release listing several regions counts as its best one ("best") or its first ("first").
  multi_region: best

# Renaming files to a template (a set's Rename tab), for the tools that read the library
# after us (RomM and other frontends read tags from file names). Each set picks one in
# Settings -> Romset management; a revert gives a file the name it had before its first
# rename. Every template is offered where it can work, unless the platform lists its own
# (platforms.profiles.<id>.rename_templates).
rename:
  # What a set starts with, unless its platform says otherwise (rename_default).
  default_template: dat
  templates:
    keep:
      label: Keep names
      description: Files keep the names they have; nothing is proposed.
      example: ""
    dat:
      label: DAT name
      description: >-
        The name the DAT gives the game, with its tags (region, languages, revision). RomM,
        ES-DE and RetroArch's thumbnails read these names.
      example: Legend of Zelda, The - A Link to the Past (USA).sfc
      format: "{game}"
    clean:
      label: Clean title
      description: >-
        The DAT name without its tags (disc, side and tape numbers stay), for frontends
        that show the file name as the title.
      example: Legend of Zelda, The - A Link to the Past.sfc
      format: "{title}"
    switch:
      label: Switch style
      description: >-
        The game's name, its title ID and its version, as Tinfoil-style tools name NSPs.
        RomM finds games by the title ID. Needs the version (prod.keys read it when the
        file has no cnmt.xml).
      example: 80 DAYS [0100B9900A1D0000][v0].nsp
      format: "{title} [{title_id}][v{version}]"
      title_ids: true
  # How a file must have been identified to take its name: a checksum (or an identical copy
  # of a file matched by one), a title ID, or the user's own assignment. A name from
  # Hasheous or a name match is not proof enough.
  methods: [dat-checksum, dat-headerless, duplicate, title-id, manual]
  # Characters some filesystems refuse in a name (exFAT, Windows shares), each replaced.
  unsafe_characters: '\/:*?"<>|'
  replacement: "_"
  # A tag of a name: a (...) or [...] group. Clean title drops every tag except those
  # starting with one of clean_keeps.
  tag_pattern: '\s*[(\[]([^)\]]*)[)\]]'
  clean_keeps: [Disc, Disk, Side, Tape, Part]
  # The longest file name most filesystems take, in bytes (UTF-8).
  max_name_bytes: 255
