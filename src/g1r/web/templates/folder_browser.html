<div class="browser">
  <input type="hidden" name="path" value="{{ browser.path }}">
  <div class="crumbs">
    <a href="#" hx-get="/browse" hx-target="#browser" hx-vals='{"mount": "{{ browser.mount }}", "path": ""}'>{{ browser.mount }}</a>
    {% for name, rel in browser.crumbs %} / <a href="#" hx-get="/browse" hx-target="#browser" hx-vals='{"mount": "{{ browser.mount }}", "path": {{ rel | tojson }}}'>{{ name }}</a>{% endfor %}
  </div>
  {% if browser.error %}<p class="error">{{ browser.error }}</p>{% endif %}
  <ul class="dirs">
    {% for child in browser.children %}
    <li><a href="#" hx-get="/browse" hx-target="#browser" hx-vals='{"mount": "{{ browser.mount }}", "path": {{ browser.join(child) | tojson }}}'>📁 {{ child }}</a></li>
    {% else %}
    <li class="muted">No subfolders</li>
    {% endfor %}
  </ul>
  <p class="selected">Selected: <code>{{ browser.location }}</code></p>
</div>
